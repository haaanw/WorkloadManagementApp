<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:16px 20px}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-3);text-transform:uppercase;margin:0 0 8px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const {Toggle,SegmentedControl,TextField,Stepper,ReadoutWell}=window.DesignSystem_cf6e68;
function Demo(){
  const [on,setOn]=React.useState(true);const [r,setR]=React.useState('28D');const [v,setV]=React.useState('');const [kg,setKg]=React.useState(80);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px 28px'}}>
    <div><div className="lbl">TOGGLE</div><Toggle checked={on} onChange={setOn} label="Morning check-in"/></div>
    <div><div className="lbl">SEGMENTED</div><SegmentedControl options={['7D','28D','90D']} value={r} onChange={setR}/></div>
    <div><div className="lbl">TEXT FIELD</div><TextField label="Email" value={v} onChange={setV} placeholder="you@example.com"/></div>
    <div><div className="lbl">STEPPER — DETENT</div><Stepper value={kg} onChange={setKg} step={2.5} unit="KG"/></div>
    <div style={{gridColumn:'1/-1'}}><div className="lbl">READOUT WELLS</div>
      <div style={{display:'flex',gap:12}}><ReadoutWell value="62" unit="MS" color="var(--metric-recovery)"/><ReadoutWell value="7.6" unit="H" color="var(--metric-sleep)"/><ReadoutWell value="1.12" unit="ACWR" color="var(--metric-load)"/></div></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
