<!-- @dsCard group="iOS App" viewport="420x820" name="Tuwa iOS" subtitle="Dashboard · Load & progress · Log workout — interactive" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tuwa iOS — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:#E4E2DD;font-family:var(--font-sans);display:flex;justify-content:center;padding:24px 0;min-height:100vh;box-sizing:border-box}
a{color:var(--text-2)}a:hover{color:var(--text-1)}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="LoadScreen.jsx"></script>
<script type="text/babel" src="WorkoutSheet.jsx"></script>
<script type="text/babel">
function App(){
  const {TabBar}=window.DesignSystem_cf6e68;
  const [tab,setTab]=React.useState('Home');
  const [sheet,setSheet]=React.useState(false);
  const Dashboard=window.TuwaDashboard,LoadScreen=window.TuwaLoadScreen,WorkoutSheet=window.TuwaWorkoutSheet;
  const [,force]=React.useReducer(n=>n+1,0);
  React.useEffect(()=>{if(!(Dashboard&&LoadScreen&&WorkoutSheet)){const t=setInterval(()=>{if(window.TuwaDashboard&&window.TuwaLoadScreen&&window.TuwaWorkoutSheet){clearInterval(t);force();}},50);return()=>clearInterval(t);}});
  if(!(Dashboard&&LoadScreen&&WorkoutSheet))return null;
  const stub=(t)=><div style={{padding:'120px 32px',textAlign:'center'}}>
    <div style={{fontSize:'var(--text-page-title)'}}>{t}</div>
    <div style={{fontFamily:'var(--font-mono)',fontSize:10,textTransform:'uppercase',color:'var(--text-3)',marginTop:8}}>NOT YET RECREATED — SEE assets/screens</div></div>;
  return <div style={{width:390,height:772,background:'var(--bg)',border:'1px solid #CCC9C2',borderRadius:34,overflow:'hidden',position:'relative',display:'flex',flexDirection:'column'}} data-screen-label={tab}>
    <div style={{display:'flex',justifyContent:'space-between',padding:'14px 28px 4px',fontSize:13,fontWeight:500}}><span style={{fontVariantNumeric:'tabular-nums'}}>09:41</span><span style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--text-3)'}}>●●● ▲ ▮</span></div>
    <div style={{flex:1,overflowY:'auto'}}>
      {tab==='Home'&&<Dashboard onStart={()=>setSheet(true)}/>}
      {tab==='Load'&&<LoadScreen/>}
      {tab==='Log'&&stub('Workout log')}
      {tab==='Recovery'&&stub('Recovery')}
      {tab==='Profile'&&stub('Profile')}
    </div>
    <TabBar items={['Home','Log','Recovery','Load','Profile']} active={tab} onSelect={t=>{setTab(t);if(t==='Log')setSheet(true);}}/>
    {sheet&&<WorkoutSheet onClose={()=>setSheet(false)}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
