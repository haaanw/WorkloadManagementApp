<!-- @dsCard group="Colors" viewport="700x260" name="The Accent Rule" subtitle="Travertine #6F6759 — hero reading + live-state marks ONLY" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--font-sans);padding:16px 20px;font-size:15px}
.anno{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase}
</style></head><body>
<div style="display:flex;gap:14px;align-items:stretch">
<div style="flex:1;background:var(--surface-el);border:var(--hairline) solid var(--divider);border-radius:var(--radius-card);padding:14px 16px">
<div class="anno" style="color:var(--zone-optimal)">✓ ALLOWED</div>
<div style="display:flex;align-items:center;gap:14px;margin-top:8px">
<span style="font-size:44px;color:var(--accent);font-variant-numeric:tabular-nums">82</span>
<span style="display:inline-block;width:64px;height:4px;background:var(--well-top);border-radius:2px;position:relative"><i style="position:absolute;left:0;top:0;width:70%;height:4px;background:var(--accent);border-radius:2px"></i></span>
<span style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></span>
<span style="display:inline-block;width:1.5px;height:22px;background:var(--accent)"></span></div>
<div class="anno" style="margin-top:8px">HERO SCORE · PROGRESS FILL · LIVE DOT · NEEDLE / TAB TICK</div></div>
<div style="flex:1;background:var(--surface-el);border:var(--hairline) solid var(--divider);border-radius:var(--radius-card);padding:14px 16px">
<div class="anno" style="color:var(--zone-danger)">✕ NEVER</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:8px;opacity:.55">
<span style="background:var(--accent);color:var(--ink-inverse);border-radius:var(--radius-pill);padding:8px 18px;font-size:11px;font-weight:500;text-decoration:line-through">Start session</span>
<span style="color:var(--accent);font-size:15px;text-decoration:line-through">Accent label</span></div>
<div class="anno" style="margin-top:8px">CTA FILLS · BODY/LABEL TEXT · ICON TINTS AT REST · DECORATION</div></div></div></body></html>
