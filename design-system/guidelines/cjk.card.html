<!-- @dsCard group="Type" viewport="700x260" name="CJK & localization" subtitle="zh-Hans rules: no case transforms, no added tracking, wider chip padding" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--font-sans);padding:16px 20px;font-size:15px}
.anno{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase}
.r{padding:10px 0;border-bottom:var(--hairline) solid var(--divider)}.r:last-child{border-bottom:0}</style></head><body>
<div class="r" style="font-family:var(--font-cjk);font-size:26px">今日就绪度 <span style="color:var(--metric-readiness);font-variant-numeric:tabular-nums">82</span> — 按计划进行</div>
<div class="r" style="display:flex;gap:10px;align-items:center">
<span style="font-size:11px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--zone-optimal);border:var(--hairline) solid var(--zone-optimal);border-radius:var(--radius-pill);padding:4px 8px">Optimal</span>
<span style="font-family:var(--font-cjk);font-size:11px;color:var(--zone-optimal);border:var(--hairline) solid var(--zone-optimal);border-radius:var(--radius-pill);padding:4px 16px">状态良好</span>
<span class="anno">EN: CAPS +TRACKING, PAD 8 · ZH: NONE, PAD 16</span></div>
<div class="r anno">CASCADE: 'INSTRUMENT SANS','NOTO SANS SC' · MONO ANNOTATION STAYS LATIN</div></body></html>
