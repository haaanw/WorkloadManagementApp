<!-- @dsCard group="Type" viewport="700x240" name="Numerals & readout wells" subtitle="Tabular figures always; values sit in fixed-width debossed wells" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--font-sans);padding:16px 20px;font-size:15px}
.anno{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase}
.well{display:inline-flex;align-items:baseline;gap:6px;background:linear-gradient(var(--well-top),var(--well-bottom));border:var(--hairline) solid var(--divider-strong);border-radius:var(--radius-control);padding:10px 16px;box-shadow:inset 0 1.5px 0 var(--relief-shade)}</style></head><body>
<div style="display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 14px">
<span class="well"><span style="font-size:26px;font-variant-numeric:tabular-nums">62</span><span class="anno">MS</span></span>
<span class="well"><span style="font-size:26px;font-variant-numeric:tabular-nums">7.6</span><span class="anno">H</span></span>
<span class="well"><span style="font-size:26px;font-variant-numeric:tabular-nums">1.12</span><span class="anno">ACWR</span></span>
<span class="well"><span style="font-size:26px;font-variant-numeric:tabular-nums;color:var(--metric-strain)">1480</span><span class="anno">KG·REP</span></span></div>
<div style="font-size:22px;font-variant-numeric:tabular-nums">0123456789 <span style="color:var(--text-3)">— tabular: digits change, the stone never resizes</span></div></body></html>
