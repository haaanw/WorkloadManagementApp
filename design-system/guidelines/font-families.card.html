<!-- @dsCard group="Type" viewport="700x360" name="Font families" subtitle="Three voices: Instrument Sans · Fragment Mono · Alpino (+ Noto Sans SC CJK fallback)" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--font-sans);padding:16px 20px;font-size:15px}
.anno{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase}
.f{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:baseline;padding:11px 0;border-bottom:var(--hairline) solid var(--divider)}
.f:last-child{border-bottom:0}.s{font-size:25px;line-height:1.2}</style></head><body>
<div class="f"><div class="anno">Instrument Sans 400 · UI voice</div><div class="s">Know when to push, when to hold.</div></div>
<div class="f"><div class="anno">Instrument Sans 500</div><div class="s" style="font-weight:500">Readiness 82 — proceed as planned</div></div>
<div class="f"><div class="anno">Fragment Mono · annotation ≤12px</div><div class="s" style="font-family:var(--font-mono);font-size:12px">HRV_BASELINE: TRUE · 62MS +4 · D-028 ▁▃▅▇</div></div>
<div class="f"><div class="anno">Alpino · display, marketing only</div><div class="s" style="font-family:var(--font-display);font-weight:650">Know when to push.</div></div>
<div class="f"><div class="anno">Noto Sans SC · CJK cascade</div><div class="s" style="font-family:var(--font-cjk)">知道何时该冲，何时该守。</div></div></body></html>
