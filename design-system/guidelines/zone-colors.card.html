<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--font-sans);padding:16px 20px;font-size:15px}
.anno{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase}
.zb{font-size:11px;letter-spacing:var(--tracking-caps);text-transform:uppercase;border-radius:var(--radius-pill);padding:4px 10px;border:var(--hairline) solid}</style></head><body>
<div style="display:flex;border:var(--hairline) solid var(--divider-strong)">
<div style="background:var(--zone-optimal);color:var(--ink-inverse);flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box;font-family:var(--font-mono);font-size:9px;text-transform:uppercase">optimal 2E7D4F</div><div style="background:var(--zone-caution);color:var(--ink-inverse);flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box;font-family:var(--font-mono);font-size:9px;text-transform:uppercase">caution 8A5C08</div><div style="background:var(--zone-danger);color:var(--ink-inverse);flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box;font-family:var(--font-mono);font-size:9px;text-transform:uppercase">danger 9E3428</div><div style="background:var(--zone-low);color:var(--ink-inverse);flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box;font-family:var(--font-mono);font-size:9px;text-transform:uppercase">low 52589E</div></div>
<div style="display:flex;gap:10px;margin-top:12px;align-items:center">
<span class="zb" style="color:var(--zone-optimal);border-color:var(--zone-optimal)">Optimal</span>
<span class="zb" style="color:var(--zone-caution);border-color:var(--zone-caution)">Caution</span>
<span class="zb" style="color:var(--zone-danger);border-color:var(--zone-danger)">High risk</span>
<span class="anno">TEXT + HAIRLINE CAPSULE · NEVER A FILL · ≥4.5:1 ON STONE</span></div></body></html>
