<!-- @dsCard group="Spacing" viewport="700x240" name="Corner law & hairlines" subtitle="12 cards / 8 controls / pill chips+CTA. Hairlines 0.5px. Nothing else." -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--text-1);font-family:var(--font-sans);padding:16px 20px;font-size:15px}
.anno{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase}
</style></head><body>
<div style="display:flex;gap:16px;align-items:flex-end;margin-top:4px">
<div style="width:150px;height:96px;background:var(--surface-el);border:var(--hairline) solid var(--divider);border-radius:var(--radius-card);display:flex;align-items:flex-end;padding:8px"><span class="anno">card · 12</span></div>
<div style="width:130px;height:64px;background:var(--surface);border:var(--hairline) solid var(--divider-strong);border-radius:var(--radius-control);display:flex;align-items:flex-end;padding:8px"><span class="anno">control · 8</span></div>
<span style="background:var(--text-1);color:var(--ink-inverse);border-radius:var(--radius-pill);padding:12px 26px;font-size:11px;font-weight:500">pill · CTA</span>
<span style="font-size:11px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--zone-optimal);border:var(--hairline) solid var(--zone-optimal);border-radius:var(--radius-pill);padding:4px 10px">pill · chip</span></div>
<div class="anno" style="margin-top:14px">ELEVATION = PLANE + 0.5PX HAIRLINE + RELIEF · NO SHADOWS ANYWHERE</div></body></html>
